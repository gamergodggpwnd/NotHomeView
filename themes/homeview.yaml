    @container (min-width:480px) and (min-height:480px){:host(hui-clock-card) hui-clock-card-analog{zoom:1.833}
    @container (min-width:500px) and (min-height:500px){:host(hui-clock-card) hui-clock-card-analog{zoom:1.909}
    @container (min-width:520px) and (min-height:520px){:host(hui-clock-card) hui-clock-card-analog{zoom:1.985}
    @container (min-width:540px) and (min-height:540px){:host(hui-clock-card) hui-clock-card-analog{zoom:2.062}
    @container (min-width:560px) and (min-height:560px){:host(hui-clock-card) hui-clock-card-analog{zoom:2.138}
