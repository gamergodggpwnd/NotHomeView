HomeView Light:
  card-mod-theme: HomeView Light
  # plain theme variables (also give a basic glass look without card-mod)
  ha-card-border-radius: "min(5.6vh, 3vw)"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(0,0,0,.035)"
  ha-card-box-shadow: "0 .4vh 1.4vh rgba(30,30,60,.06)"
  ha-card-backdrop-filter: "none"
  ha-card-background: "#ffffff"
  primary-text-color: "#3c3c43"
  secondary-text-color: "rgba(60,60,67,.55)"
  state-icon-color: "#3c3c43"
  frosted-glass-card-layer-content: "none"
  hv-bg: "#ffffff"
  hv-bg-on: "#cbc4ee"
  hv-border: "rgba(0,0,0,.035)"
  hv-border-on: "rgba(110,90,210,.15)"
  hv-shadow: "0 .4vh 1.4vh rgba(30,30,60,.06)"
  hv-shadow-on: "none"
  hv-blur: "none"
  hv-text: "#3c3c43"
  hv-text-strong: "#1c1c1e"
  hv-text2: "rgba(60,60,67,.55)"
  hv-text-on: "#3f3399"
  hv-text2-on: "rgba(63,51,153,.65)"
  hv-icon: "#3c3c43"
  hv-icon-on: "#5a4bc4"
  hv-shade: "none"
  hv-icon-shade: "none"
  hv-accent: "#7a6ae0"
  hv-track: "rgba(60,60,67,.12)"
  hv-radius: "min(5.6vh, 3vw)"
  card-mod-card: *homeview_card_mod
