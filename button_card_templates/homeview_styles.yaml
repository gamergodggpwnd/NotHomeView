        const fitSections = (view, edit) => {
          const on = !!FIT && !edit;
          /* one full-width column: the single section spans the whole window (12 sub-columns), also in edit mode */
          if (FIT && view.style.getPropertyValue('--column-max-width') !== '100vw') view.style.setProperty('--column-max-width', '100vw');
          if (view.hasAttribute('hv-fit') !== on) view.toggleAttribute('hv-fit', on);
          const sr = view.shadowRoot; if (!sr) return;
          if (FIT) adopt(sr, VIEW_FIT_CSS);
          const hs = on && sr.querySelectorAll('.content > .section').length > 1; if (view.hasAttribute('hv-hs') !== hs) view.toggleAttribute('hv-hs', hs); if (FIT) adopt(sr, HS_CSS); if (hs) bindSnap(sr.querySelector('.content'), location.pathname);
          const grids = []; const walk = r => { for (const e of r.querySelectorAll('*')) { if (e.tagName === 'HUI-GRID-SECTION') grids.push(e); else if (e.shadowRoot && grids.length < 20) walk(e.shadowRoot); } }; walk(sr);
          const set = (k, v) => { if (v == null) { if (view.style.getPropertyValue(k)) view.style.removeProperty(k); } else if (view.style.getPropertyValue(k) !== v) view.style.setProperty(k, v); };
          if (!on) { ['--hv-fit-row', '--hv-fit-gap', '--hv-fit-top', '--hv-fit-bottom', '--hv-fit-left', '--hv-fit-right'].forEach(k => set(k, null)); return; }
          grids.forEach(g => g.shadowRoot && adopt(g.shadowRoot, GRID_FIT_CSS));
          /* rows to fit = tallest grid section (in row units), read from the resolved grid tracks */
          let rows = 0; for (const g of grids) { const c = g.shadowRoot && g.shadowRoot.querySelector('.container'); if (!c) continue;
