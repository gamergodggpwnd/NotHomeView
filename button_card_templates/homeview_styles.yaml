    custom_fields:
      hv: |-
        [[[
        /* HomeView style helper: applies the shared HomeView CSS (same rules as themes/homeview.yaml) to every card in THIS view,
           so the tiles themselves stay plain native cards. Delete this card once the HomeView theme file is installed. */
        const me = this, STY = variables.styles || {}, VARS = variables.vars || {};
        const W = window.__homeview || (window.__homeview = {sheets: new Map()});
        const sheet = css => { let s = W.sheets.get(css); if (!s) { s = new CSSStyleSheet(); s.replaceSync(css); W.sheets.set(css, s); } return s; };
        const adopt = (root, css) => { if (!root || !css) return; const s = sheet(css); if (!root.adoptedStyleSheets.includes(s)) root.adoptedStyleSheets = [...root.adoptedStyleSheets, s]; };
        const isCard = el => el.shadowRoot && Array.from(el.shadowRoot.children).some(c => c.tagName === 'HA-CARD');
        const styleCard = el => {
          for (const [sel, css] of Object.entries(STY)) {
            let roots = [el.shadowRoot];
            for (const seg of sel.split('$').map(s => s.trim()).filter(s => s && s !== '.')) {
              const next = []; roots.forEach(r => r.querySelectorAll(seg).forEach(x => x.shadowRoot && next.push(x.shadowRoot))); roots = next;
            }
            roots.forEach(r => adopt(r, css));
          }
        };
        const scan = (root, view) => {
          for (const el of root.querySelectorAll('*')) {
            if (el === me || el.tagName === 'POPUP-CARD') continue;
            if (isCard(el)) styleCard(el); else if (el.shadowRoot) scan(el.shadowRoot, view);
          }
        };
        const findView = () => { let n = me; for (let i = 0; i < 25 && n; i++) { const h = n.getRootNode && n.getRootNode().host; if (!h) return null;
          if (h.tagName === 'HUI-SECTIONS-VIEW') return h;
          if (h.shadowRoot && h.shadowRoot.getElementById('root') && h.tagName.endsWith('-LAYOUT')) return h; n = h; } return null; };
        /* sections view: the wrapper <div class="card"> around this helper's <hui-card> (never the whole section) */
        const sectionCell = () => { let n = me; for (let i = 0; i < 20 && n; i++) { if (n.tagName === 'HUI-CARD') { const p = n.parentElement; return p && p.classList.contains('card') ? p : null; }
          n = n.parentElement || (n.getRootNode && n.getRootNode().host); } return null; };
        /* sections view "fill": rows stretch so the grid fills the window height (like the old full-screen grid). Drag & drop and the
           native Layout tab are untouched; only --row-height / gaps / paddings change, and only outside edit mode. */
        const SAT = 'env(safe-area-inset-top, 0px)', SAB = 'env(safe-area-inset-bottom, 0px)';
        const FIT = variables.fit === false ? null : Object.assign({ margin: 'clamp(8px, 1.6vmin, 12px)', gap: 'calc(max(8px, 2.2vmin) + 8px)', side: 'calc(max(8px, 2.2vmin) + 4px)', min_row: 28 }, variables.fit || {});
        const VIEW_FIT_CSS = `:host([hv-fit]) .wrapper{padding:0 var(--hv-fit-right) 0 var(--hv-fit-left) !important}
        :host([hv-fit]) .container{padding:var(--hv-fit-top) 0 var(--hv-fit-bottom) !important;min-height:0 !important}`;
        const GRID_FIT_CSS = `.container{--row-height:var(--hv-fit-row, 56px) !important;--row-gap:var(--hv-fit-gap, 8px) !important;--column-gap:var(--hv-fit-gap, 8px) !important;gap:var(--hv-fit-gap, 8px) !important}`;
        /* measure CSS lengths (safe areas, vmin based margins) in px with a hidden probe */
        const px = css => { let p = W.probe; if (!p || !p.isConnected) { p = W.probe = document.createElement('div'); p.style.cssText = 'position:fixed;left:-9999px;top:0;width:0;visibility:hidden;pointer-events:none'; document.body.appendChild(p); }
          p.style.height = css; return p.getBoundingClientRect().height; };
        /* padding that Home Assistant / kiosk-mode already put around the view (safe areas, header offset) */
        const outerPad = view => { const o = { t: 0, b: 0, l: 0, r: 0 }; let n = view.parentElement || view.getRootNode().host;
          for (let i = 0; i < 8 && n && n.tagName !== 'HUI-ROOT'; i++) { const cs = getComputedStyle(n); o.t += parseFloat(cs.paddingTop) || 0; o.b += parseFloat(cs.paddingBottom) || 0;
            o.l += parseFloat(cs.paddingLeft) || 0; o.r += parseFloat(cs.paddingRight) || 0; n = n.parentElement || (n.getRootNode && n.getRootNode().host); } return o; };
        /* more than one section: section 1 keeps filling the window; every further section is its own full-width page to the right
           (swipe / scroll horizontally, snaps per section). Edit mode keeps the native sections layout (drag & drop, add section). */
        const HS_CSS = `:host([hv-hs]) .wrapper{padding-left:0 !important;padding-right:0 !important}
        :host([hv-hs]) .container{display:block !important;padding-left:0 !important;padding-right:0 !important}
        :host([hv-hs]) .content{display:flex !important;flex-wrap:nowrap !important;align-items:flex-start !important;justify-content:flex-start !important;place-content:normal !important;justify-content:flex-start !important;margin:0 !important;gap:0 !important;width:100% !important;max-width:none !important;
         overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x pan-y}
        :host([hv-hs]) .content::-webkit-scrollbar{display:none}
