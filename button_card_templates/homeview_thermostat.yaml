# HomeView thermostat tile (button-card): huge set-point with small decimal, "Heat - Now 21.6" subline,
# chevrons lower/raise the set-point by 0.5, tap = Climate popup (browser_mod), hold = more-info.
# Already included in dashboards/homeview-example.yaml. To add it to another dashboard, paste these under button_card_templates:.
# Card:  {type: custom:button-card, template: [homeview_thermostat, homeview_popup_climate], entity: climate.x, label: Living Room,
#         view_layout: {grid-column: span 2, grid-row: span 2}}   (add homeview_light to the template list on a HomeView Light view)
button_card_templates:
  homeview_tile:
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    variables:
      theme: dark
      'on': '[[[ return entity ? ["on","open","opening","closing","playing","unlocked"].includes(entity.state) : false ]]]'
    hold_action:
      action: more-info
    double_tap_action:
      action: none
    extra_styles: :host{display:block !important;height:100% !important;width:100% !important;max-width:none !important;container-type:size;--frosted-glass-card-layer-content:none;--hp-rad:min(5.6vh, 3vw)}ha-card::before{content:none !important;display:none !important;backdrop-filter:none !important}
    styles:
      card:
      - height: 100%
      - width: 100%
      - border-radius: var(--hp-rad)
      - padding: 7cqh 5cqw 8cqh
      - box-sizing: border-box
      - font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif
      - overflow: hidden
      - -webkit-tap-highlight-color: transparent
      - user-select: none
      - -webkit-user-select: none
      - -webkit-touch-callout: none
      - transition: background .25s ease, box-shadow .25s ease
      - background: '[[[ const on=variables.on; if(variables.theme=="light") return on? "#cbc4ee" : "#ffffff"; return on? "linear-gradient(150deg, rgba(196,182,255,.46) 0%, rgba(160,140,250,.34) 100%)" : "linear-gradient(150deg, rgba(255,255,255,.15) 0%, rgba(255,255,255,.07) 100%)"; ]]]'
      - border: '[[[ if(variables.theme=="light") return "1px solid rgba(0,0,0,.035)"; return variables.on? "1px solid rgba(225,215,255,.42)" : "1px solid rgba(255,255,255,.25)"; ]]]'
      - box-shadow: '[[[ if(variables.theme=="light") return "0 .4vh 1.4vh rgba(30,30,60,.06)"; return variables.on? "inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 .5px rgba(255,255,255,.12), 0 1.2vh 3.6vh rgba(50,30,160,.30)" : "inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 .5px rgba(255,255,255,.06), 0 1.2vh 3.6vh rgba(6,8,60,.26)"; ]]]'
      - backdrop-filter: '[[[ return variables.theme=="light" ? "none" : "blur(26px) saturate(180%)"; ]]]'
      - -webkit-backdrop-filter: '[[[ return variables.theme=="light" ? "none" : "blur(26px) saturate(180%)"; ]]]'
      grid:
      - grid-template-areas: '"i" "n" "l"'
      - grid-template-rows: 1fr min-content min-content
      - grid-template-columns: 100%
      - height: 100%
      img_cell:
      - align-self: center
      - justify-self: center
      - width: 100%
      - height: 100%
      - display: flex
      - align-items: center
      - justify-content: center
      icon:
      - width: min(30cqh, 20cqw)
      - height: min(30cqh, 20cqw)
      - color: '[[[ if(variables.theme=="light") return variables.on? "#5a4bc4" : "#3c3c43"; return variables.on? "#f3efff" : "#ffffff"; ]]]'
      - filter: '[[[ return (variables.theme=="light") ? "none" : "drop-shadow(0 .3vh .8vh rgba(0,0,40,.25))"; ]]]'
      name:
      - font-size: min(11.5cqh,7cqw)
      - font-weight: '650'
      - margin-top: 1cqh
      - letter-spacing: -.01em
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - color: '[[[ if(variables.theme=="light") return variables.on? "#3f3399" : "#3c3c43"; return "#ffffff"; ]]]'
      - text-shadow: '[[[ return (variables.theme=="light") ? "none" : "0 1px 6px rgba(0,0,40,.25)"; ]]]'
      label:
      - font-size: min(9.6cqh,5.9cqw)
      - font-weight: '500'
      - margin-top: .5cqh
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - color: '[[[ if(variables.theme=="light") return variables.on? "rgba(63,51,153,.65)" : "rgba(60,60,67,.55)"; return variables.on? "rgba(255,255,255,.80)" : "rgba(255,255,255,.66)"; ]]]'
  homeview_light:
    variables:
      theme: light
  homeview_thermostat:
    template: homeview_tile
    show_icon: false
    name: Thermostat
    variables:
      'on': false
      compact: false
    show_label: '[[[ return !variables.compact ]]]'
    hold_action:
      action: more-info
    custom_fields:
      temp: '[[[ const a=entity.attributes; const t=parseFloat(a.temperature); let i="--",f=""; if(!isNaN(t)){i=Math.trunc(t); f=(Math.round((t-i)*10)? "."+Math.round((t-i)*10) : "");} const cur=a.current_temperature!=null? (Math.round(a.current_temperature*10)/10)+"°" : ""; const mode = entity.state=="off" ? "Off" : (a.hvac_action=="heating"? "Heating" : (entity.state=="heat"? "Heat" : entity.state)); return `<div class="big">${i}<span class="dec">${f}</span><span class="deg">°</span></div>` + (variables.compact? "" : `<div class="sub">${mode} · Now ${cur}</div>`); ]]]'
      down:
        card:
          type: custom:button-card
          icon: mdi:chevron-down
          show_name: false
          show_state: false
          extra_styles: ha-card{background:transparent !important;border:none !important;box-shadow:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important}ha-card::before{content:none !important;display:none !important;backdrop-filter:none !important}
          tap_action:
            action: perform-action
            perform_action: climate.set_temperature
            data:
              entity_id: '[[[ return entity.entity_id ]]]'
              temperature: '[[[ const a=entity.attributes; let t=(parseFloat(a.temperature)||20)-0.5; t=Math.max(a.min_temp||5, Math.min(a.max_temp||30, t)); return Math.round(t*2)/2; ]]]'
          hold_action:
            action: none
          double_tap_action:
            action: none
          styles:
            card:
            - padding: '0'
            - height: 100%
            - width: 100%
            - border-radius: var(--hp-rad)
            - -webkit-tap-highlight-color: transparent
            grid:
            - grid-template-areas: '"i"'
            - height: 100%
            img_cell:
            - height: 100%
            - width: 100%
            - display: flex
            - align-items: center
            - justify-content: center
            icon:
            - width: '[[[ return variables.compact ? "min(30cqh,18cqw)" : "min(17cqh,11cqw)"; ]]]'
            - height: '[[[ return variables.compact ? "min(30cqh,18cqw)" : "min(17cqh,11cqw)"; ]]]'
            - color: '[[[ return variables.theme=="light" ? "#3c3c43" : "#ffffff"; ]]]'
      up:
        card:
          type: custom:button-card
          icon: mdi:chevron-up
          show_name: false
          show_state: false
          extra_styles: ha-card{background:transparent !important;border:none !important;box-shadow:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important}ha-card::before{content:none !important;display:none !important;backdrop-filter:none !important}
          tap_action:
            action: perform-action
            perform_action: climate.set_temperature
            data:
              entity_id: '[[[ return entity.entity_id ]]]'
              temperature: '[[[ const a=entity.attributes; let t=(parseFloat(a.temperature)||20)+0.5; t=Math.max(a.min_temp||5, Math.min(a.max_temp||30, t)); return Math.round(t*2)/2; ]]]'
          hold_action:
            action: none
          double_tap_action:
            action: none
          styles:
            card:
            - padding: '0'
            - height: 100%
            - width: 100%
            - border-radius: var(--hp-rad)
            - -webkit-tap-highlight-color: transparent
            grid:
            - grid-template-areas: '"i"'
            - height: 100%
            img_cell:
            - height: 100%
            - width: 100%
            - display: flex
            - align-items: center
            - justify-content: center
            icon:
            - width: '[[[ return variables.compact ? "min(30cqh,18cqw)" : "min(17cqh,11cqw)"; ]]]'
            - height: '[[[ return variables.compact ? "min(30cqh,18cqw)" : "min(17cqh,11cqw)"; ]]]'
            - color: '[[[ return variables.theme=="light" ? "#3c3c43" : "#ffffff"; ]]]'
    styles:
      card:
      - padding: '0'
      grid:
      - grid-template-areas: '[[[ return variables.compact ? ''"temp temp temp" "down n up"'' : ''"temp temp temp" "down n up" "down l up"''; ]]]'
      - grid-template-rows: '[[[ return variables.compact ? "1fr min-content" : "1fr min-content min-content"; ]]]'
      - grid-template-columns: '[[[ return variables.compact ? "26% 1fr 26%" : "24% 1fr 24%"; ]]]'
      custom_fields:
        temp:
        - align-self: center
        - justify-self: center
        - text-align: center
        - padding-top: 4cqh
        - overflow: visible
        - color: '[[[ return variables.theme=="light" ? "#1c1c1e" : "#ffffff"; ]]]'
        down:
        - height: 100%
        - align-self: stretch
        - overflow: visible
        up:
        - height: 100%
        - align-self: stretch
        - overflow: visible
      name:
      - font-size: '[[[ return variables.compact ? "min(10.5cqh,6.6cqw)" : "min(6.2cqh,3.6cqw)"; ]]]'
      - padding-bottom: '[[[ return variables.compact ? "7cqh" : "0"; ]]]'
      label:
      - font-size: min(5.2cqh,3cqw)
      - padding-bottom: 6cqh
    extra_styles: ':host{display:block !important;height:100% !important;width:100% !important;max-width:none !important;container-type:size;--frosted-glass-card-layer-content:none;--hp-rad:min(5.6vh, 3vw)}ha-card::before{content:none !important;display:none !important;backdrop-filter:none !important}#down > *, #up > *{display:block !important;height:100% !important;width:100% !important;max-width:none !important}.big{font-family:ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, sans-serif; font-weight:300; font-size:min(50cqh,30cqw); line-height:1.05; letter-spacing:-.04em; font-variant-numeric:tabular-nums}.dec{font-size:.42em; letter-spacing:0} .deg{font-size:.42em; vertical-align:top; position:relative; top:.08em; margin-left:.04em; opacity:.85}.sub{font-size:min(4.8cqh,2.9cqw); font-weight:550; opacity:.62; margin-top:1.4cqh; letter-spacing:.02em}'
  homeview_popup_climate:
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Climate
          dismissable: true
          content:
            type: custom:auto-entities
            show_empty: false
            card_param: cards
            sort:
              method: friendly_name
            card:
              type: grid
              columns: 2
              square: false
            filter:
              include:
              - domain: climate
                options:
                  type: tile
                  features:
                  - type: target-temperature
                  features_position: bottom
              exclude:
              - state: unavailable
