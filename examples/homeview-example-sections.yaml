# HomeView example dashboard - SECTIONS version (native drag & drop + the Layout tab in the card editor).
# Same tiles as homeview-example.yaml, but each view is a native `type: sections` view with one full-width grid section.
# Sizes: a 1x1 tile is grid_options {columns: 3, rows: 2} (12 sub-columns = 4 tiles across), the thermostat is 6x4 (2x2 tiles).
# The `homeview_styles` helper card in each view makes the rows fill the screen height outside edit mode (see README).
# The clock uses clock_size: small + card_mod so its 2x2 minimum allows a 1-tile-wide clock (large would force 6x4).
# Paste into the raw configuration editor, then replace the example entities and <your-dashboard-url>.
title: NotHomeView
button_card_templates:
  homeview_tile:
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    variables:
      theme: dark
      'on': '[[[ return entity ? ["on","open","opening","closing","playing","unlocked"].includes(entity.state) : false ]]]'
    hold_action:
      action: more-info
    double_tap_action:
      action: none
    extra_styles: :host{display:block !important;height:100% !important;width:100% !important;max-width:none !important;container-type:size;--frosted-glass-card-layer-content:none;--hp-rad:min(5.6vh, 3vw)}ha-card::before{content:none !important;display:none !important;backdrop-filter:none !important}
    styles:
      card:
      - height: 100%
      - width: 100%
      - border-radius: var(--hp-rad)
      - padding: 7cqh 5cqw 8cqh
      - box-sizing: border-box
      - font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif
      - overflow: hidden
      - -webkit-tap-highlight-color: transparent
      - user-select: none
      - -webkit-user-select: none
      - -webkit-touch-callout: none
      - transition: background .25s ease, box-shadow .25s ease
      - background: '[[[ const on=variables.on; if(variables.theme=="light") return on? "#cbc4ee" : "#ffffff"; return on? "linear-gradient(150deg, rgba(196,182,255,.46) 0%, rgba(160,140,250,.34) 100%)" : "linear-gradient(150deg, rgba(255,255,255,.15) 0%, rgba(255,255,255,.07) 100%)"; ]]]'
      - border: '[[[ if(variables.theme=="light") return "1px solid rgba(0,0,0,.035)"; return variables.on? "1px solid rgba(225,215,255,.42)" : "1px solid rgba(255,255,255,.25)"; ]]]'
      - box-shadow: '[[[ if(variables.theme=="light") return "0 .4vh 1.4vh rgba(30,30,60,.06)"; return variables.on? "inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 .5px rgba(255,255,255,.12), 0 1.2vh 3.6vh rgba(50,30,160,.30)" : "inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 .5px rgba(255,255,255,.06), 0 1.2vh 3.6vh rgba(6,8,60,.26)"; ]]]'
      - backdrop-filter: '[[[ return variables.theme=="light" ? "none" : "blur(26px) saturate(180%)"; ]]]'
      - -webkit-backdrop-filter: '[[[ return variables.theme=="light" ? "none" : "blur(26px) saturate(180%)"; ]]]'
      grid:
      - grid-template-areas: '"i" "n" "l"'
      - grid-template-rows: 1fr min-content min-content
      - grid-template-columns: 100%
      - height: 100%
      img_cell:
      - align-self: center
      - justify-self: center
      - width: 100%
      - height: 100%
      - display: flex
      - align-items: center
      - justify-content: center
      icon:
      - width: min(30cqh, 20cqw)
      - height: min(30cqh, 20cqw)
      - color: '[[[ if(variables.theme=="light") return variables.on? "#5a4bc4" : "#3c3c43"; return variables.on? "#f3efff" : "#ffffff"; ]]]'
      - filter: '[[[ return (variables.theme=="light") ? "none" : "drop-shadow(0 .3vh .8vh rgba(0,0,40,.25))"; ]]]'
      name:
      - font-size: min(11.5cqh,7cqw)
      - font-weight: '650'
      - margin-top: 1cqh
      - letter-spacing: -.01em
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - color: '[[[ if(variables.theme=="light") return variables.on? "#3f3399" : "#3c3c43"; return "#ffffff"; ]]]'
      - text-shadow: '[[[ return (variables.theme=="light") ? "none" : "0 1px 6px rgba(0,0,40,.25)"; ]]]'
      label:
      - font-size: min(9.6cqh,5.9cqw)
      - font-weight: '500'
      - margin-top: .5cqh
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      - color: '[[[ if(variables.theme=="light") return variables.on? "rgba(63,51,153,.65)" : "rgba(60,60,67,.55)"; return variables.on? "rgba(255,255,255,.80)" : "rgba(255,255,255,.66)"; ]]]'
  homeview_light:
    variables:
      theme: light
  homeview_thermostat:
    template: homeview_tile
    show_icon: false
    name: Thermostat
    variables:
      'on': false
      compact: false
    show_label: '[[[ return !variables.compact ]]]'
    hold_action:
      action: more-info
    custom_fields:
      temp: '[[[ const a=entity.attributes; const t=parseFloat(a.temperature); let i="--",f=""; if(!isNaN(t)){i=Math.trunc(t); f=(Math.round((t-i)*10)? "."+Math.round((t-i)*10) : "");} const cur=a.current_temperature!=null? (Math.round(a.current_temperature*10)/10)+"°" : ""; const mode = entity.state=="off" ? "Off" : (a.hvac_action=="heating"? "Heating" : (entity.state=="heat"? "Heat" : entity.state)); return `<div class="big">${i}<span class="dec">${f}</span><span class="deg">°</span></div>` + (variables.compact? "" : `<div class="sub">${mode} · Now ${cur}</div>`); ]]]'
      down:
        card:
          type: custom:button-card
          icon: mdi:chevron-down
          show_name: false
          show_state: false
          extra_styles: ha-card{background:transparent !important;border:none !important;box-shadow:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important}ha-card::before{content:none !important;display:none !important;backdrop-filter:none !important}
          tap_action:
            action: perform-action
            perform_action: climate.set_temperature
            data:
              entity_id: '[[[ return entity.entity_id ]]]'
              temperature: '[[[ const a=entity.attributes; let t=(parseFloat(a.temperature)||20)-0.5; t=Math.max(a.min_temp||5, Math.min(a.max_temp||30, t)); return Math.round(t*2)/2; ]]]'
          hold_action:
            action: none
          double_tap_action:
            action: none
          styles:
            card:
            - padding: '0'
            - height: 100%
            - width: 100%
            - border-radius: var(--hp-rad)
            - -webkit-tap-highlight-color: transparent
            grid:
            - grid-template-areas: '"i"'
            - height: 100%
            img_cell:
            - height: 100%
            - width: 100%
            - display: flex
            - align-items: center
            - justify-content: center
            icon:
            - width: '[[[ return variables.compact ? "min(30cqh,18cqw)" : "min(17cqh,11cqw)"; ]]]'
            - height: '[[[ return variables.compact ? "min(30cqh,18cqw)" : "min(17cqh,11cqw)"; ]]]'
            - color: '[[[ return variables.theme=="light" ? "#3c3c43" : "#ffffff"; ]]]'
      up:
        card:
          type: custom:button-card
          icon: mdi:chevron-up
          show_name: false
          show_state: false
          extra_styles: ha-card{background:transparent !important;border:none !important;box-shadow:none !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important}ha-card::before{content:none !important;display:none !important;backdrop-filter:none !important}
          tap_action:
            action: perform-action
            perform_action: climate.set_temperature
            data:
              entity_id: '[[[ return entity.entity_id ]]]'
              temperature: '[[[ const a=entity.attributes; let t=(parseFloat(a.temperature)||20)+0.5; t=Math.max(a.min_temp||5, Math.min(a.max_temp||30, t)); return Math.round(t*2)/2; ]]]'
          hold_action:
            action: none
          double_tap_action:
            action: none
          styles:
            card:
            - padding: '0'
            - height: 100%
            - width: 100%
            - border-radius: var(--hp-rad)
            - -webkit-tap-highlight-color: transparent
            grid:
            - grid-template-areas: '"i"'
            - height: 100%
            img_cell:
            - height: 100%
            - width: 100%
            - display: flex
            - align-items: center
            - justify-content: center
            icon:
            - width: '[[[ return variables.compact ? "min(30cqh,18cqw)" : "min(17cqh,11cqw)"; ]]]'
            - height: '[[[ return variables.compact ? "min(30cqh,18cqw)" : "min(17cqh,11cqw)"; ]]]'
            - color: '[[[ return variables.theme=="light" ? "#3c3c43" : "#ffffff"; ]]]'
    styles:
      card:
      - padding: '0'
      grid:
      - grid-template-areas: '[[[ return variables.compact ? ''"temp temp temp" "down n up"'' : ''"temp temp temp" "down n up" "down l up"''; ]]]'
      - grid-template-rows: '[[[ return variables.compact ? "1fr min-content" : "1fr min-content min-content"; ]]]'
      - grid-template-columns: '[[[ return variables.compact ? "26% 1fr 26%" : "24% 1fr 24%"; ]]]'
      custom_fields:
        temp:
        - align-self: center
        - justify-self: center
        - text-align: center
        - padding-top: 4cqh
        - overflow: visible
        - color: '[[[ return variables.theme=="light" ? "#1c1c1e" : "#ffffff"; ]]]'
        down:
        - height: 100%
        - align-self: stretch
        - overflow: visible
        up:
        - height: 100%
        - align-self: stretch
        - overflow: visible
      name:
      - font-size: '[[[ return variables.compact ? "min(10.5cqh,6.6cqw)" : "min(6.2cqh,3.6cqw)"; ]]]'
      - padding-bottom: '[[[ return variables.compact ? "7cqh" : "0"; ]]]'
      label:
      - font-size: min(5.2cqh,3cqw)
      - padding-bottom: 6cqh
    extra_styles: ':host{display:block !important;height:100% !important;width:100% !important;max-width:none !important;container-type:size;--frosted-glass-card-layer-content:none;--hp-rad:min(5.6vh, 3vw)}ha-card::before{content:none !important;display:none !important;backdrop-filter:none !important}#down > *, #up > *{display:block !important;height:100% !important;width:100% !important;max-width:none !important}.big{font-family:ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, sans-serif; font-weight:300; font-size:min(50cqh,30cqw); line-height:1.05; letter-spacing:-.04em; font-variant-numeric:tabular-nums}.dec{font-size:.42em; letter-spacing:0} .deg{font-size:.42em; vertical-align:top; position:relative; top:.08em; margin-left:.04em; opacity:.85}.sub{font-size:min(4.8cqh,2.9cqw); font-weight:550; opacity:.62; margin-top:1.4cqh; letter-spacing:.02em}'
  homeview_popup_climate:
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Climate
          dismissable: true
          content:
            type: custom:auto-entities
            show_empty: false
            card_param: cards
            sort:
              method: friendly_name
            card:
              type: grid
              columns: 2
              square: false
            filter:
              include:
              - domain: climate
                options:
                  type: tile
                  features:
                  - type: target-temperature
                  features_position: bottom
              exclude:
              - state: unavailable
  homeview_styles:
    show_icon: false
    show_name: true
    show_state: false
    show_label: false
    name: HomeView styles (keep this card)
    tap_action:
      action: none
    hold_action:
      action: none
    variables:
      theme: glass
      styles:
        .: :host(:not(button-card)){display:block;height:100%;width:100%;container-type:size;--frosted-glass-card-layer-content:none}:host(:not(button-card)) ha-card{height:100%;box-sizing:border-box;overflow:hidden;font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; background:var(--hv-bg) !important;border:1px solid var(--hv-border) !important;border-radius:var(--hv-radius) !important; box-shadow:var(--hv-shadow) !important;backdrop-filter:var(--hv-blur) !important;-webkit-backdrop-filter:var(--hv-blur) !important; --ha-card-border-radius:var(--hv-radius);--primary-text-color:var(--hv-text);--secondary-text-color:var(--hv-text2); transition:background .25s ease, box-shadow .25s ease;-webkit-tap-highlight-color:transparent}ha-card::before{content:none !important;display:none !important;backdrop-filter:none !important}:host(:not(button-card)) ha-card.active{background:var(--hv-bg-on) !important;border-color:var(--hv-border-on) !important;box-shadow:var(--hv-shadow-on) !important; --primary-text-color:var(--hv-text-on);--secondary-text-color:var(--hv-text2-on)}:host(hui-tile-card) ha-tile-icon{--tile-icon-size:min(34cqh,22cqw);--mdc-icon-size:min(30cqh,20cqw);--tile-icon-opacity:0;--tile-icon-hover-opacity:.08; --tile-icon-color:var(--hv-icon) !important;filter:var(--hv-icon-shade)}:host(hui-tile-card) ha-card.active ha-tile-icon{--tile-icon-color:var(--hv-icon-on) !important}:host(hui-tile-card) ha-tile-info{--ha-tile-info-primary-font-size:min(11.5cqh,7cqw);--ha-tile-info-primary-font-weight:650;--ha-tile-info-primary-line-height:1.2; --ha-tile-info-secondary-font-size:min(9.6cqh,5.9cqw);--ha-tile-info-secondary-font-weight:500;--ha-tile-info-secondary-line-height:1.2; --ha-tile-info-primary-color:var(--hv-text);--ha-tile-info-secondary-color:var(--hv-text2);text-shadow:var(--hv-shade)}:host(hui-tile-card) ha-card.active ha-tile-info{--ha-tile-info-primary-color:var(--hv-text-on);--ha-tile-info-secondary-color:var(--hv-text2-on)}:host(hui-button-card) ha-card{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:7cqh 5cqw 8cqh !important}:host(hui-button-card) ha-state-icon{--mdc-icon-size:min(30cqh,20cqw);width:min(30cqh,20cqw) !important;height:min(30cqh,20cqw) !important;color:var(--hv-icon);filter:var(--hv-icon-shade);flex:1;display:flex;align-items:center}:host(hui-button-card) span{font-size:min(11.5cqh,7cqw);font-weight:650;color:var(--hv-text);text-shadow:var(--hv-shade)}:host(hui-clock-card) ha-card{display:flex;align-items:center;justify-content:center;padding:0 !important}:host(hui-clock-card) hui-clock-card-analog{--ha-clock-card-analog-face-background:#fff;--ha-clock-card-analog-face-border-radius:50%; --primary-text-color:#1c1c1e;--ha-color-border-danger-normal:#ff9500;--divider-color:transparent;border-radius:50%; box-shadow:0 .6vh 2vh rgba(0,0,40,.18);zoom:.45}@container (min-width:120px) and (min-height:120px){:host(hui-clock-card) hui-clock-card-analog{zoom:0.458}}@container (min-width:140px) and (min-height:140px){:host(hui-clock-card) hui-clock-card-analog{zoom:0.535}}@container (min-width:160px) and (min-height:160px){:host(hui-clock-card) hui-clock-card-analog{zoom:0.611}}@container (min-width:180px) and (min-height:180px){:host(hui-clock-card) hui-clock-card-analog{zoom:0.687}}@container (min-width:200px) and (min-height:200px){:host(hui-clock-card) hui-clock-card-analog{zoom:0.764}}@container (min-width:220px) and (min-height:220px){:host(hui-clock-card) hui-clock-card-analog{zoom:0.840}}@container (min-width:240px) and (min-height:240px){:host(hui-clock-card) hui-clock-card-analog{zoom:0.916}}@container (min-width:260px) and (min-height:260px){:host(hui-clock-card) hui-clock-card-analog{zoom:0.993}}@container (min-width:280px) and (min-height:280px){:host(hui-clock-card) hui-clock-card-analog{zoom:1.069}}@container (min-width:300px) and (min-height:300px){:host(hui-clock-card) hui-clock-card-analog{zoom:1.145}}@container