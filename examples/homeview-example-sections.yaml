        name: Lights on
        icon: mdi:lightbulb-group-outline
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Lights
              content:
                type: vertical-stack
                cards:
                - type: heading
                  heading: 'On'
                  heading_style: subtitle
                  icon: mdi:lightbulb-on
                - type: custom:auto-entities
                  show_empty: false
                  card:
                    type: grid
                    columns: 1
                    square: false
                  card_param: cards
                  sort:
                    method: friendly_name
                  filter:
                    include:
                    - domain: light
                      state: 'on'
                      options:
                        type: tile
                        tap_action:
                          action: toggle
                          entity: this.entity_id
                        hold_action:
                          action: fire-dom-event
                          browser_mod:
                            service: browser_mod.sequence
                            data:
                              sequence:
                              - service: browser_mod.close_popup
                              - service: browser_mod.delay
                                data:
                                  time: 250
                              - service: browser_mod.more_info
                                data:
                                  entity: this.entity_id
                                  ignore_popup_card: true
                    exclude:
                    - entity_id: light.*_dnd
                    - entity_id: light.browser_mod_*
