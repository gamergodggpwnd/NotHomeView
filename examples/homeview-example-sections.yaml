wallpanel:
  enabled: false
  enabled_on_views:
  - main
  - home
  - room-living-room
  - room-basement
  - room-master
  - room-office
  - room-laundry
  - room-dining
  - room-upstairs
  - room-garage
  - room-outside
  - security
  hide_toolbar: true
  hide_sidebar: true
  fullscreen: true
  keep_fullscreen: true
  idle_time: 120
  fade_in_time: 2
  fade_out_time_interaction: 0.3
  crossfade_time: 2.5
  display_time: 25
  control_reactivation_time: 0.8
  keep_screen_on_time: 86400
  black_screen_after_time: 0
  stop_screensaver_on_mouse_move: true
  stop_screensaver_on_mouse_click: true
  disable_screensaver_on_browser_mod_popup: true
  screensaver_stop_close_browser_mod_popup: true
  image_url: media-source://media_source/local/
  media_order: random
  media_list_update_interval: 3600
  exclude_filenames:
  - /(cdrom|floppy|usb)(/|$)
  exclude_media_types:
  - video
  image_fit_landscape: cover
  image_fit_portrait: cover
  show_image_info: false
  show_progress_bar: false
  info_animation_duration_x: 0
  info_animation_duration_y: 0
  info_move_interval: 0
  cards:
  - type: clock
    clock_style: digital
    clock_size: large
    time_format: '12'
    show_seconds: false
    no_background: true
    card_mod:
      style:
        .: ha-card{background:none !important;border:none !important;box-shadow:none !important;backdrop-filter:none !important;--frosted-glass-card-layer-content:none}ha-card::before{content:none !important;display:none !important;backdrop-filter:none !important}
        hui-clock-card-digital $: .time-parts{font-family:ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, sans-serif !important;font-size:min(40vh,27vw) !important;font-weight:500 !important;line-height:1 !important;color:rgba(255,255,255,.62) !important;letter-spacing:-.005em;text-shadow:0 .4vh 4vh rgba(0,0,0,.16);gap:0 !important}.time-part{font-size:inherit !important;font-weight:inherit !important;color:inherit !important;font-family:inherit !important}.time-part.minute::before,.time-part + .time-part::before{color:inherit !important}.time-part.am-pm{display:none !important}
    wp_style:
      width: 100vw
  style:
    wallpanel-screensaver-info-container:
      align-items: flex-start
      justify-content: center
      padding: 3vh 0 0 0
    wallpanel-screensaver-info-box:
      background-color: transparent
      box-shadow: none
      border-radius: '0'
      padding: '0'
      margin: 0 auto
      --ha-card-background: transparent
      --primary-text-color: rgba(255,255,255,.72)
    wallpanel-screensaver-info-box-content:
      background: transparent
      box-shadow: none
      backdrop-filter: none
    wp-card:
      background: transparent
    wallpanel-screensaver-overlay:
      background-color: rgba(0,0,0,.08)
