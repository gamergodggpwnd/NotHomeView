        icon: mdi:home-thermometer-outline
        tap_action:
          action: fire-dom-event
          browser_mod:
            service: browser_mod.popup
            data:
              title: Climate
              content:
                type: vertical-stack
                cards:
                - type: custom:auto-entities
                  show_empty: false
                  card:
                    type: grid
                    columns: 1
                    square: false
                  card_param: cards
                  sort:
                    method: friendly_name
                  filter:
                    include:
                    - domain: climate
                      state: /^(heat|cool|heat_cool|auto|dry|fan_only)$/
                      options:
                        type: tile
                        features:
                        - type: target-temperature
                        features_position: bottom
                        tap_action:
                          action: more-info
                        hold_action:
                          action: fire-dom-event
