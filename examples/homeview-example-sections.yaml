          for (const el of root.querySelectorAll('*')) {
            if (el === me || el.tagName === 'POPUP-CARD') continue;
            if (isCard(el)) styleCard(el); else if (el.shadowRoot) scan(el.shadowRoot, view);
          }
        };
        const findView = () => { let n = me; for (let i = 0; i < 25 && n; i++) { const h = n.getRootNode && n.getRootNode().host; if (!h) return null;
          if (h.tagName === 'HUI-SECTIONS-VIEW') return h;
          if (h.shadowRoot && h.shadowRoot.getElementById('root') && h.tagName.endsWith('-LAYOUT')) return h; n = h; } return null; };
        /* sections view: the wrapper <div class="card"> around this helper's <hui-card> (never the whole section) */
        const sectionCell = () => { let n = me; for (let i = 0; i < 20 && n; i++) { if (n.tagName === 'HUI-CARD') { const p = n.parentElement; return p && p.classList.contains('card') ? p : null; }
