    custom_fields:
      hv: "[[[\n/* HomeView style helper: applies the shared HomeView CSS (same rules as themes/homeview.yaml) to every card in THIS view,\n   so the tiles themselves stay plain native cards. Delete this card once the HomeView theme file is installed. */\nconst me = this, STY = variables.styles || {}, VARS = variables.vars || {};\nconst W = window.__homeview || (window.__homeview = {sheets: new Map()});\nconst sheet = css => { let s = W.sheets.get(css); if (!s) { s = new CSSStyleSheet(); s.replaceSync(css); W.sheets.set(css, s); } return s; };\nconst adopt = (root, css) => { if (!root || !css) return; const s = sheet(css); if (!root.adoptedStyleSheets.includes(s)) root.adoptedStyleSheets = [...root.adoptedStyleSheets, s]; };\nconst isCard = el => el.shadowRoot && Array.from(el.shadowRoot.children).some(c => c.tagName === 'HA-CARD');\nconst styleCard = el => {\n  for (const [sel, css] of Object.entries(STY)) {\n    let roots = [el.shadowRoot];\n    for (const seg of sel.split('$').map(s => s.trim()).filter(s => s && s !== '.')) {\n      const next = []; roots.forEach(r => r.querySelectorAll(seg).forEach(x => x.shadowRoot && next.push(x.shadowRoot))); roots = next;\n    }\n    roots.forEach(r => adopt(r, css));\n  }\n};\nconst scan = (root, view) => {\n  for (const el of root.querySelectorAll('*')) {\n    if (el === me || el.tagName === 'POPUP-CARD') continue;\n    if (isCard(el)) styleCard(el); else if (el.shadowRoot) scan(el.shadowRoot, view);\n  }\n};\nconst findView = () => { let n = me; for (let i = 0; i < 25 && n; i++) { const h = n.getRootNode && n.getRootNode().host; if (!h) return null;\n  if (h.tagName === 'HUI-SECTIONS-VIEW') return h;\n  if (h.shadowRoot && h.shadowRoot.getElementById('root') && h.tagName.endsWith('-LAYOUT')) return h; n = h; } return null; };\n/* sections view: the wrapper <div class=\"card\"> around this helper's <hui-card> (never the whole section) */\nconst sectionCell = () => { let n = me; for (let i = 0; i < 20 && n; i++) { if (n.tagName === 'HUI-CARD') { const p = n.parentElement; return p && p.classList.contains('card') ? p : null; }\n  n = n.parentElement || (n.getRootNode && n.getRootNode().host); } return null; };\n/* sections view \"fill\": rows stretch so the grid fills the window height (like the old full-screen grid). Drag & drop and the\n   native Layout tab are untouched; only --row-height / gaps / paddings change, and only outside edit mode. */\nconst SAT = 'env(safe-area-inset-top, 0px)', SAB = 'env(safe-area-inset-bottom, 0px)';\nconst FIT = variables.fit === false ? null : Object.assign({ margin: 'clamp(8px, 1.6vmin, 12px)', gap: 'calc(max(8px, 2.2vmin) + 8px)', side: 'calc(max(8px, 2.2vmin) + 4px)', min_row: 28 }, variables.fit || {});\nconst VIEW_FIT_CSS = `:host([hv-fit]) .wrapper{padding:0 var(--hv-fit-right) 0 var(--hv-fit-left) !important}\n:host([hv-fit]) .container{padding:var(--hv-fit-top) 0 var(--hv-fit-bottom) !important;min-height:0 !important}`;\nconst GRID_FIT_CSS = `.container{--row-height:var(--hv-fit-row, 56px) !important;--row-gap:var(--hv-fit-gap, 8px) !important;--column-gap:var(--hv-fit-gap, 8px) !important;gap:var(--hv-fit-gap, 8px) !important}`;\n/* measure CSS lengths (safe areas, vmin based margins) in px with a hidden probe */\nconst px = css => { let p = W.probe; if (!p || !p.isConnected) { p = W.probe = document.createElement('div'); p.style.cssText = 'position:fixed;left:-9999px;top:0;width:0;visibility:hidden;pointer-events:none'; document.body.appendChild(p); }\n  p.style.height = css; return p.getBoundingClientRect().height; };\n/* padding that Home Assistant / kiosk-mode already put around the view (safe areas, header offset) */\nconst outerPad = view => { const o = { t: 0, b: 0, l: 0, r: 0 }; let n = view.parentElement || view.getRootNode().host;\n  for (let i = 0; i < 8 && n && n.tagName !== 'HUI-ROOT'; i++) { const cs = getComputedStyle(n); o.t += parseFloat(cs.paddingTop) || 0; o.b += parseFloat(cs.paddingBottom) || 0;\n    o.l += parseFloat(cs.paddingLeft) || 0; o.r += parseFloat(cs.paddingRight) || 0; n = n.parentElement || (n.getRootNode && n.getRootNode().host); } return o; };\n/* more than one section: section 1 keeps filling the window; every further section is its own full-width page to the right\n   (swipe / scroll horizontally, snaps per section). Edit mode keeps the native sections layout (drag & drop, add section). */\nconst HS_CSS = `:host([hv-hs]) .wrapper{padding-left:0 !important;padding-right:0 !important}\n:host([hv-hs]) .container{display:block !important;padding-left:0 !important;padding-right:0 !important}\n:host([hv-hs]) .content{display:flex !important;flex-wrap:nowrap !important;align-items:flex-start !important;justify-content:flex-start !important;place-content:normal !important;justify-content:flex-start !important;margin:0 !important;gap:0 !important;width:100% !important;max-width:none !important;\n overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x pan-y}\n:host([hv-hs]) .content::-webkit-scrollbar{display:none}\n:host([hv-hs]) .content > .section{flex:0 0 100% !important;width:100% !important;max-width:none !important;min-width:0;box-sizing:border-box;\n padding:0 var(--hv-fit-right, 0px) 0 var(--hv-fit-left, 0px) !important;margin:0 !important;scroll-snap-align:start;scroll-snap-stop:always;grid-column:auto !important;grid-row:auto !important}`;\n/* pages: native CSS scroll-snap does the snapping (iOS / Safari / Chrome). Nothing here ever scrolls on its own during or\n   right after a swipe: the page is remembered when scrolling has stopped and restored only if the scroller is rebuilt or resized.\n   A gentle fallback (nearest page from the CURRENT position, once scrolling is idle) runs only where native snap is missing or\n   did not settle (never on iOS / WebKit touch devices). */\nconst HS_IOS = /AppleWebKit/.test(navigator.userAgent) && !/Chrome|Chromium|CriOS|FxiOS|Edg|Android/.test(navigator.userAgent) && (navigator.maxTouchPoints || 0) > 0;\nconst HS_NATIVE = !!(window.CSS && CSS.supports && CSS.supports('scroll-snap-type', 'x mandatory'));\nconst bindSnap = (c, key) => { if (!c) return; const P = W.hsPage || (W.hsPage = new Map()); const w = () => c.clientWidth || 1;\n  const want = () => (P.get(key) || 0) * w();\n  if (c.__hvSnap) return; c.__hvSnap = true;\n  let touching = false, t = null;\n  const restore = () => { if (touching) return; const x = want(); if (Math.abs(c.scrollLeft - x) > 2) c.scrollLeft = x; };\n  if (P.get(key)) { restore(); requestAnimationFrame(restore); }\n  const settle = () => { if (touching) return; const i = Math.round(c.scrollLeft / w()); P.set(key, i);\n    if (HS_IOS) return; const x = i * w(); if (Math.abs(c.scrollLeft - x) > 2) c.scrollTo({ left: x, behavior: HS_NATIVE ? 'auto' : 'smooth' }); };\n  c.addEventListener('touchstart', () => { touching = true; clearTimeout(t); }, { passive: true });\n  const up = () => { touching = false; clearTimeout(t); t = setTimeout(settle, 400); };\n  c.addEventListener('touchend', up, { passive: true }); c.addEventListener('touchcancel', up, { passive: true });\n  c.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(settle, 400); }, { passive: true });\n  if (window.ResizeObserver) new ResizeObserver(restore).observe(c); };\nconst fitSections = (view, edit) => {\n  const on = !!FIT && !edit;\n  /* one full-width column: the single section spans the whole window (12 sub-columns), also in edit mode */\n  if (FIT && view.style.getPropertyValue('--column-max-width') !== '100vw') view.style.setProperty('--column-max-width', '100vw');\n  if (view.hasAttribute('hv-fit') !== on) view.toggleAttribute('hv-fit', on);\n  const sr = view.shadowRoot; if (!sr) return;\n  if (FIT) adopt(sr, VIEW_FIT_CSS);\n  const hs = on && sr.querySelectorAll('.content > .section').length > 1; if (view.hasAttribute('hv-hs') !== hs) view.toggleAttribute('hv-hs', hs); if (FIT) adopt(sr, HS_CSS); if (hs) bindSnap(sr.querySelector('.content'), location.pathname);\n  const grids = []; const walk = r => { for (const e of r.querySelectorAll('*')) { if (e.tagName === 'HUI-GRID-SECTION') grids.push(e); else if (e.shadowRoot && grids.length < 20) walk(e.shadowRoot); } }; walk(sr);\n  const set = (k, v) => { if (v == null) { if (view.style.getPropertyValue(k)) view.style.removeProperty(k); } else if (view.style.getPropertyValue(k) !== v) view.style.setProperty(k, v); };\n  if (!on) { ['--hv-fit-row', '--hv-fit-gap', '--hv-fit-top', '--hv-fit-bottom', '--hv-fit-left', '--hv-fit-right'].forEach(k => set(k, null)); return; }\n  grids.forEach(g => g.shadowRoot && adopt(g.shadowRoot, GRID_FIT_CSS));\n  /* rows to fit = tallest grid section (in row units), read from the resolved grid tracks */\n  let rows = 0; for (const g of grids) { const c = g.shadowRoot && g.shadowRoot.querySelector('.container'); if (!c) continue;\n    const t = getComputedStyle(c).gridTemplateRows; const n = t && t !== 'none' ? t.trim().split(/\\s+/).length : 0; if (n > rows) rows = n; }\n  if (!rows) return;\n  const o = outerPad(view), m = px(FIT.margin), gap = px(FIT.gap), side = px(FIT.side);\n  const sat = px(SAT), sab = px(SAB), sal = px('env(safe-area-inset-left, 0px)'), sar = px('env(safe-area-inset-right, 0px)');\n  const top = Math.max(sat + m, o.t), bottom = Math.max(m, sab + 4, o.b);             // wanted distance from the window edges\n  const left = Math.max(side, sal, o.l), right = Math.max(side, sar, o.r);\n  const r1 = v => Math.round(v * 10) / 10 + 'px';\n  set('--hv-fit-gap', r1(gap)); set('--hv-fit-top', r1(top - o.t)); set('--hv-fit-bottom', r1(bottom - o.b));\n  set('--hv-fit-left', r1(left - o.l)); set('--hv-fit-right', r1(right - o.r));\n  set('--hv-fit-row', `max(${FIT.min_row}px, calc((var(--hv-vh, 100dvh) - ${r1(top + bottom + (rows - 1) * gap)}) / ${rows}))`);\n};\nconst tick = () => {\n  const view = findView(); if (!view) return false;\n  for (const [k, v] of Object.entries(VARS)) if (view.style.getPropertyValue('--' + k) !== v) view.style.setProperty('--' + k, v);\n  const edit = !!(view.lovelace && view.lovelace.editMode);\n  /* hide this helper's grid cell outside edit mode */\n  let cell = null;\n  if (view.tagName === 'HUI-SECTIONS-VIEW') cell = sectionCell();\n  else { cell = me; while (cell && cell.parentElement && cell.parentElement.id !== 'root') cell = cell.parentElement;\n    if (!cell || !cell.parentElement) { let n = me; while (n && n.getRootNode() !== view.shadowRoot) n = n.getRootNode().host; cell = n; } }\n  if (cell && cell.style.display !== (edit ? '' : 'none')) cell.style.display = edit ? '' : 'none';\n  if (view.tagName === 'HUI-SECTIONS-VIEW') fitSections(view, edit);\n  scan(view.shadowRoot, view); return true;\n};\nif (!me.__hvTimer) {\n  me.__hvTimer = setInterval(() => { if (!me.isConnected) { clearInterval(me.__hvTimer); me.__hvTimer = null; return; } tick(); }, 700);\n  setTimeout(tick, 50);\n}\nreturn '';\n]]]"
    styles:
      card:
      - padding: 2vh
      - font-size: 1.6vh
      - opacity: '.7'
kiosk_mode:
  hide_header: true
  hide_sidebar: true
wallpanel:
  enabled: false
  enabled_on_views:
  - main
  - light
