  type: sections
  theme: HomeView Glass
  background: 'radial-gradient(60% 80% at 88% 8%, rgba(150,165,255,.85) 0%, rgba(150,165,255,0) 60%),radial-gradient(70% 60% at 30% 108%, rgba(40,30,190,.95) 0%, rgba(40,30,190,0) 70%),radial-gradient(45% 35% at 58% 46%, rgba(190,200,255,.55) 0%, rgba(190,200,255,0) 70%),radial-gradient(90% 40% at 70% 70%, rgba(85,70,230,.65) 0%, rgba(85,70,230,0) 70%),linear-gradient(140deg, #0a1050 0%, #1a2391 38%, #3341cf 62%, #18208a 82%, #0b1050 100%)'
  max_columns: 1
  dense_section_placement: true
  sections:
  - type: grid
    column_span: 1
    cards:
    - type: custom:homeview-thermostat-card
      entity: climate.example_thermostat
      name: Thermostat
      room: Living Room
      step: 0.5
      tap_action:
        action: more-info
      hold_action:
        action: more-info
      grid_options:
        columns: 6
        rows: 4
    - type: clock
      clock_style: analog
      clock_size: small
      show_seconds: true
      seconds_motion: continuous
      ticks: minute
      face_style: numbers_upright
      border: false
      card_mod:
        style:
          hui-clock-card-analog $: .analog-clock{--clock-size:220px !important}.tick .number.small{font-size:var(--ha-font-size-l) !important}
      grid_options:
        columns: 3
        rows: 4
    - type: custom:homeview-music-card
      np_popup_style: fullscreen   # tap opens Now Playing full screen (or: window)
      entity: media_player.example_speaker
      name: Music
      icon: mdi:music
      hold_action:
        action: more-info
      entities:
      - media_player.example_speaker_2
      grid_options:
        columns: 3
        rows: 2
    - type: custom:homeview-nav-card
      name: Home
      icon: mdi:home-outline
      navigation_path: /<your-dashboard-url>/light
      alt_navigation_path: /<your-dashboard-url>/main
      keep_query: true
      entity: zone.home
      active: entity
      hold_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            content:
              type: custom:auto-entities
              show_empty: false
              card_param: cards
              sort:
                method: friendly_name
              card:
                type: grid
                columns: 2
                square: false
              filter:
                include:
                - domain: light
                  options:
                    type: tile
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    features:
                    - type: light-brightness
                    features_position: bottom
                exclude:
                - state: unavailable
                - entity_id: light.browser_mod_*
            title: Lights
            dismissable: true
      grid_options:
        columns: 3
        rows: 2
    # HomeView Camera (1.7): uncomment and pick your camera. Sizes 2x3 / 2x6 / 4x6; the editor sets grid_options.
    # NotHomeView Battery: big %, rounded bar (green / yellow / red), bolt while charging (auto-detected on the same device)
    # NotHomeView People: avatar, badge, name, zone or street; tap = map popup
    # - type: custom:homeview-person-card
    #   entity: person.jane
    # - type: custom:homeview-battery-card
    #   entity: sensor.phone_battery_level
    #   name: Phone
    #   grid_options: {columns: 3, rows: 2}
    # - type: custom:homeview-camera-card
    #   entity: camera.front_yard
    #   name: Front Yard
    #   size: 2x6   # 2x3 | 2x6 | 4x6 | 4x3 (Tall: one tile wide, two tiles tall)
    #   grid_options: {columns: 6, rows: 2}
    #   buttons:
    #   - entity: light.example_ceiling
    #     name: Lights
    - type: custom:homeview-scene-card
      entity: scene.example_good_night
      name: Good Night
      icon: mdi:weather-night
      confirm_text: Run the Good Night scene?
      grid_options:
        columns: 3
        rows: 2
    - type: custom:homeview-garage-card
      entity: cover.example_garage_door
      name: Garage
      confirm: true
      confirm_text: Open or close the garage door?
      grid_options:
        columns: 3
        rows: 2
    - type: custom:homeview-light-card
      entity: light.example_ceiling
      name: Ceiling Lights
      icon: mdi:ceiling-light
      grid_options:
        columns: 3
        rows: 2
    - type: custom:homeview-light-card
      entity: light.example_floor_lamp
      name: Floor Lamp
      icon: mdi:floor-lamp
      grid_options:
        columns: 3
        rows: 2
    - type: custom:button-card
      template: homeview_styles
      variables:
        theme: glass
      grid_options:
        columns: full
        rows: auto
    - type: custom:homeview-edit-button-card
      position: top-right
      style: dark
      admin_only: true
      show_screensaver_button: true   # Wallpanel screensaver settings button under the pencil
      grid_options:
        columns: full
        rows: auto
