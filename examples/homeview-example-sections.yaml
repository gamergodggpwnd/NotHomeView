# NotHomeView example dashboard (v1.30.7) - SECTIONS layout, the same build as the NotHomeView test dashboard, made generic.
# Views: Home Screen (main), Home (device page), Security, nine room pages, Lights On and Climate.
# Every entity is a placeholder (light.example_..., climate.example_..., person.example_alex, ...). Replace them with yours:
# click a tile in edit mode and pick your entity in the visual editor - no YAML needed.
# Navigation paths use the dashboard URL "nothomeview": create the dashboard with that URL, or find-and-replace "/nothomeview/".
# Paste into: Settings > Dashboards > Add dashboard > New dashboard from scratch > open it > pencil > three dots > Raw configuration editor.
# Uses: card-mod (sky background, clock size), browser_mod (popups), button-card (homeview_styles helper card in each view),
# auto-entities (Lights / Climate popups), kiosk-mode (optional) and Wallpanel (screensaver; enabled: false until you turn it on).
# The Device pages theme (Night / Day / Auto) is the `theme:` option of the Home Screen card (here: day). Remove it for Night.
title: NotHomeView
kiosk_mode:
  hide_header: true
  hide_sidebar: true
views:
- type: sections
  theme: HomeView Glass
  background: 'center / cover no-repeat fixed #0d0f0e'
  max_columns: 1
  dense_section_placement: true
  title: Main
  path: main
  icon: mdi:apps
  sections:
  - type: grid
    cards:
    - type: custom:homeview-hub-card
      bg_transparency: 80
      weather_entity: weather.forecast_home
      photo_size: square
      side_sizes: S, S
      calendar_rows: '2'
      apps:
      - name: Home
        icon: hv:home
        color_from: '#ffffff'
        color_to: '#ececf1'
        kind: navigate
        navigation_path: /nothomeview/home
      - name: Security
        icon: mdi:shield-home
        color_from: '#5b8cff'
        color_to: '#2b3fd6'
        kind: navigate
        navigation_path: /nothomeview/security
      - name: Music
        icon: mdi:music-note
        color_from: '#ff6b81'
        color_to: '#f5163d'
        kind: now_playing
        entity: media_player.example_bedroom_speaker
        entities:
        - media_player.example_basement_speaker
        - media_player.example_living_room_tv
        - media_player.example_game_room_tv
      - name: Weather
        icon: mdi:weather-partly-cloudy
        color_from: '#5ec8ff'
        color_to: '#1a73e8'
        kind: weather
        weather_entity: weather.forecast_home
      grid_options:
        columns: full
        rows: auto
      fallback_person: person.example_alex
      calendar_entities:
      - calendar.example_family
      - calendar.example_holidays
      side_cards:
      - type: custom:homeview-now-playing-card
        entity: media_player.example_bedroom_speaker
        height: 100%
        entities:
        - media_player.example_basement_speaker
        - media_player.example_living_room_tv
        - media_player.example_game_room_tv
      - type: clock
        clock_style: analog
        clock_size: medium
        show_seconds: true
        seconds_motion: continuous
        ticks: minute
        face_style: numbers_upright
        border: false
      side_tiles:
      - size: square
      - size: square
      theme: day
    - type: custom:button-card
      template: homeview_styles
      variables:
        theme: glass
      grid_options:
        columns: full
        rows: auto
    - type: custom:homeview-edit-button-card
      position: top-right
      style: dark
      admin_only: true
      size: 22
      grid_options:
        columns: full
        rows: auto
      show_screensaver_button: true
- type: sections
  title: Home
